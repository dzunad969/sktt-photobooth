<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SKTT Photobooth • by Artnese</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff8ee;color:#503c2a;font:16px system-ui,-apple-system,sans-serif;text-align:center;padding:16px}.app{max-width:560px;margin:auto}h1{font-size:1.55rem;margin:8px 0}p{margin:9px 0;line-height:1.45}video{display:block;width:min(100%,390px);aspect-ratio:4/3;object-fit:cover;transform:scaleX(-1);background:#473b30;border:5px solid #e3c7a3;border-radius:14px;margin:12px auto}#count{font-size:64px;font-weight:900;min-height:76px;color:#a45d3e}#status{min-height:46px;font-weight:650}.buttons{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin:14px 0}button{border:0;border-radius:13px;padding:13px 16px;background:#55846e;color:white;font:700 15px system-ui;cursor:pointer}button.alt{background:#956a4d}button:disabled{opacity:.45}#preview{display:block;width:min(100%,235px);height:auto;margin:14px auto;box-shadow:0 4px 18px #0002}.hint{font-size:12px;color:#806c5a}#printImage{display:none}@media print{@page{size:52.5mm 148.5mm;margin:0}body{padding:0;margin:0;background:white}body>*{display:none!important}#printImage{display:block!important;width:52.5mm;height:148.5mm;object-fit:fill;position:absolute;top:0;left:0}}
</style></head><body><main class="app"><h1>🌺 Kampung Photobooth</h1><p>Hari Kanak-Kanak SK Taman Tawau 2026<br><strong>by Artnese</strong></p><video id="camera" autoplay playsinline muted></video><div id="count"></div><p id="status">Tekan BUKA KAMERA untuk mula.</p><div class="buttons"><button id="open">BUKA KAMERA</button><button id="start" disabled>START • 4 GAMBAR</button></div><canvas id="preview" width="754" height="2086"></canvas><div class="buttons"><button id="save" disabled>SAVE PHOTO</button><button id="print" class="alt" disabled>PRINT 1 STRIP</button><button id="reset" class="alt">NEW SESSION</button></div><p class="hint">4 gambar • 5.25 × 14.85 cm • RM3<br>Uji tetapan kertas Epson dahulu sebelum potong kertas banyak-banyak.</p></main><img id="printImage" alt="Photostrip untuk cetak"><script>
const el=id=>document.getElementById(id),video=el('camera'),canvas=el('preview'),ctx=canvas.getContext('2d'),frame=new Image(),slots=[[57,190,640,359],[57,580,640,365],[57,969,640,358],[57,1353,640,358]];let stream=null,photos=[],busy=false,ready=false,frameReady=false;const wait=ms=>new Promise(r=>setTimeout(r,ms));
function msg(s){el('status').textContent=s}function drawCover(img,x,y,w,h){const iw=img.width,ih=img.height,r=Math.max(w/iw,h/ih),sw=w/r,sh=h/r;ctx.drawImage(img,(iw-sw)/2,(ih-sh)/2,sw,sh,x,y,w,h)}
function draw(){ctx.fillStyle='#fffaf1';ctx.fillRect(0,0,754,2086);slots.forEach(([x,y,w,h],i)=>{ctx.save();ctx.beginPath();ctx.roundRect(x,y,w,h,42);ctx.clip();if(photos[i])drawCover(photos[i],x,y,w,h);else{ctx.fillStyle='#e8e6e3';ctx.fillRect(x,y,w,h);ctx.fillStyle='#a8a5a1';ctx.textAlign='center';ctx.font='bold 30px system-ui';ctx.fillText('GAMBAR '+(i+1),x+w/2,y+h/2)}ctx.restore()});if(frameReady)ctx.drawImage(frame,0,0,754,2086);el('printImage').src=canvas.toDataURL('image/png')}
frame.onload=()=>{frameReady=true;draw()};frame.onerror=()=>msg('Fail kampung-frame.png tiada. Upload bersama index.html.');frame.src='kampung-frame.png';draw();
async function openCamera(){try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:960}},audio:false});video.srcObject=stream;await video.play();el('start').disabled=false;msg('Kamera sedia. Tekan START untuk 4 gambar.')}catch(e){msg('Kamera tidak dapat dibuka. Benarkan Camera di Safari. '+e.message)}}
function snap(){const c=document.createElement('canvas');c.width=video.videoWidth;c.height=video.videoHeight;const g=c.getContext('2d');g.translate(c.width,0);g.scale(-1,1);g.drawImage(video,0,0);return c}
async function countdown(){for(let i=3;i>=1;i--){el('count').textContent=i;await wait(950)}el('count').textContent='📸';await wait(250);el('count').textContent=''}
async function start(){if(busy||!stream||!frameReady)return;busy=true;ready=false;photos=[];el('start').disabled=true;el('save').disabled=true;el('print').disabled=true;draw();try{for(let i=0;i<4;i++){msg('Gambar '+(i+1)+' daripada 4');await countdown();photos.push(snap());draw();await wait(350)}ready=true;el('save').disabled=false;el('print').disabled=false;msg('Siap! Simpan atau cetak satu photostrip.')}catch(e){msg('Ralat mengambil gambar: '+e.message)}finally{busy=false;el('start').disabled=false}}
function save(){if(!ready)return;canvas.toBlob(blob=>{if(!blob){msg('Tidak dapat menyimpan gambar.');return}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='SKTT-by-Artnese-'+Date.now()+'.png';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);msg('Fail PNG disediakan. Jika Safari memaparkan gambar, tekan Share → Save Image.')},'image/png')}
function reset(){if(busy)return;photos=[];ready=false;draw();el('save').disabled=true;el('print').disabled=true;el('count').textContent='';msg('Sesi baharu. Tekan START untuk 4 gambar.')}
function printStrip(){if(!ready)return;el('printImage').src=canvas.toDataURL('image/png');window.print()}
el('open').onclick=openCamera;el('start').onclick=start;el('save').onclick=save;el('print').onclick=printStrip;el('reset').onclick=reset;
</script></body></html>

<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SKTT Photobooth • by Artnese</title><style>
*{box-sizing:border-box}body{margin:0;background:#fffaf4;color:#553b2a;font:16px system-ui,-apple-system,sans-serif;text-align:center;padding:16px}.app{max-width:540px;margin:auto}h1{font-size:1.5rem;margin:8px 0}p{line-height:1.45}video{display:block;width:min(100%,390px);aspect-ratio:4/3;object-fit:cover;transform:scaleX(-1);background:#493c31;border:4px solid #ddc3a4;border-radius:14px;margin:12px auto}#count{font-size:64px;font-weight:900;min-height:74px;color:#a45d3e}#status{min-height:42px;font-weight:650}.buttons{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin:14px 0}button{border:0;border-radius:13px;padding:13px 16px;background:#59836a;color:white;font:700 15px system-ui;cursor:pointer}button.alt{background:#936d4c}button:disabled{opacity:.45}#preview{display:block;width:min(100%,245px);height:auto;margin:14px auto;box-shadow:0 4px 18px #0002}.hint{font-size:12px;color:#806c5a}</style></head><body><main class="app"><h1>🌺 Kampung Photobooth</h1><p>Hari Kanak-Kanak SK Taman Tawau 2026<br><strong>by Artnese</strong></p><video id="camera" autoplay playsinline muted></video><div id="count"></div><p id="status">Tekan BUKA KAMERA untuk mula.</p><div class="buttons"><button id="open">BUKA KAMERA</button><button id="start" disabled>START • 4 GAMBAR</button></div><canvas id="preview" width="1050" height="1500"></canvas><div class="buttons"><button id="save" disabled>SAVE PHOTO</button><button id="reset" class="alt">NEW SESSION</button></div><p class="hint">4 gambar (2 × 2) • 3.5 × 5 inci (89 × 127 mm) • RM3<br>Selepas SAVE, pilih saiz kertas 3.5 × 5 inci dalam aplikasi Epson.</p></main><script>
const el=id=>document.getElementById(id),video=el('camera'),canvas=el('preview'),ctx=canvas.getContext('2d'),frame=new Image();
const slots=[[88,312,404,394],[537,312,409,394],[88,753,404,396],[537,753,409,396]];
let stream=null,photos=[],busy=false,ready=false,frameReady=false;const wait=ms=>new Promise(r=>setTimeout(r,ms));
function msg(s){el('status').textContent=s}
function cover(img,x,y,w,h){const iw=img.width,ih=img.height,r=Math.max(w/iw,h/ih),sw=w/r,sh=h/r;ctx.drawImage(img,(iw-sw)/2,(ih-sh)/2,sw,sh,x,y,w,h)}
function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function draw(){ctx.fillStyle='#fffaf5';ctx.fillRect(0,0,1050,1500);slots.forEach(([x,y,w,h],i)=>{ctx.save();rounded(x,y,w,h,34);ctx.clip();if(photos[i])cover(photos[i],x,y,w,h);else{ctx.fillStyle='#e9e8e8';ctx.fillRect(x,y,w,h)}ctx.restore()});if(frameReady)ctx.drawImage(frame,0,0,1050,1500)}
frame.onload=()=>{frameReady=true;draw()};frame.onerror=()=>msg('Frame tiada. Pastikan kampung-frame.png dimuat naik bersama index.html.');frame.src='kampung-frame.png';draw();
async function openCamera(){try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:960}},audio:false});video.srcObject=stream;await video.play();el('start').disabled=false;msg('Kamera sedia. Tekan START.')}catch(e){msg('Benarkan Camera di Safari. '+e.message)}}
function snap(){const c=document.createElement('canvas');c.width=video.videoWidth;c.height=video.videoHeight;const g=c.getContext('2d');g.translate(c.width,0);g.scale(-1,1);g.drawImage(video,0,0);return c}
async function countdown(){for(let i=3;i>=1;i--){el('count').textContent=i;await wait(950)}el('count').textContent='📸';await wait(250);el('count').textContent=''}
async function start(){if(busy||!stream||!frameReady)return;busy=true;ready=false;photos=[];el('start').disabled=true;el('save').disabled=true;draw();try{for(let i=0;i<4;i++){msg('Gambar '+(i+1)+' daripada 4');await countdown();photos.push(snap());draw();await wait(350)}ready=true;el('save').disabled=false;msg('Siap! Tekan SAVE PHOTO.')}catch(e){msg('Ralat kamera: '+e.message)}finally{busy=false;el('start').disabled=false}}
async function save(){if(!ready)return;canvas.toBlob(async blob=>{if(!blob){msg('Gagal menyimpan.');return}const filename='SKTT-Artnese-'+Date.now()+'.png';const file=new File([blob],filename,{type:'image/png'});try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});msg('Pilih Save Image atau Save to Files pada menu Share.');return}}catch(e){if(e.name==='AbortError'){msg('Menu Share ditutup. Cuba SAVE semula.');return}}
const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);msg('PNG disediakan. Jika gambar terbuka, tekan Share → Save Image.')},'image/png')}
function reset(){if(busy)return;photos=[];ready=false;draw();el('save').disabled=true;el('count').textContent='';msg('Sesi baharu. Tekan START untuk 4 gambar.')}
el('open').onclick=openCamera;el('start').onclick=start;el('save').onclick=save;el('reset').onclick=reset;
</script></body></html>

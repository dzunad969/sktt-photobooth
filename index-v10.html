<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>SKTT Photobooth Manual Pose V10 — by Artnese</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fffaf4;color:#553b2a;font:16px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;text-align:center;padding:16px}.app{max-width:560px;margin:auto}h1{font-size:1.5rem;margin:8px 0}p{line-height:1.45}video{display:block;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);background:#493c31}#cameraOverlay{display:none;position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;z-index:2147483647;background:#16120f;overflow:hidden}#cameraOverlay.active{display:block!important;visibility:visible!important}#cameraOverlay #camera{display:block!important;position:absolute!important;inset:0!important;width:100vw!important;height:100vh!important;height:100dvh!important;max-width:none!important;max-height:none!important;object-fit:cover!important}#cameraOverlay .overlayActions{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 100px);left:0;right:0;display:flex;justify-content:center;z-index:3}#overlayStart{font-size:20px;padding:18px 28px;background:#59836a}#overlayStart:disabled{display:none}#cameraOverlay video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}#cameraOverlay .overlayTop{position:absolute;top:calc(env(safe-area-inset-top) + 16px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;color:white;text-shadow:0 2px 5px #000;font-size:clamp(18px,4vw,26px);font-weight:800}#cameraOverlay #count{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:clamp(110px,22vw,210px);color:white;text-shadow:0 4px 24px #000b;min-height:0}#cameraOverlay #overlayStatus{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 35px);left:15px;right:15px;text-align:center;color:white;font-size:clamp(20px,4vw,30px);font-weight:800;text-shadow:0 2px 8px #000}#closeCamera{background:#0009;border:1px solid #fff8;padding:10px 14px}body.capturing{overflow:hidden}#count{font-size:64px;font-weight:900;min-height:74px;color:#a45d3e}#status{min-height:42px;font-weight:650}.buttons{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin:14px 0}button{border:0;border-radius:13px;padding:13px 16px;background:#59836a;color:white;font:700 15px system-ui;cursor:pointer}button.alt{background:#936d4c}button:disabled{opacity:.45}#preview{display:block;width:min(100%,300px);height:auto;margin:14px auto;box-shadow:0 4px 18px #0002}.hint{font-size:12px;color:#806c5a}</style></head>
<body><main class="app"><h1>🌺 Kampung Photobooth</h1><p>Hari Kanak-Kanak SK Taman Tawau 2026<br><strong>by Artnese</strong></p><div id="cameraOverlay" aria-label="Paparan kamera skrin penuh"><video id="camera" autoplay playsinline muted></video><div class="overlayTop"><span id="shotLabel">KAMERA</span><button type="button" id="closeCamera">TUTUP</button></div><div id="count"></div><div class="overlayActions"><button type="button" id="overlayStart" disabled>AMBIL GAMBAR 1 / 4</button></div><div id="overlayStatus">Bersedia untuk bergambar</div></div><p id="status">Tekan BUKA KAMERA untuk mula.</p><div class="buttons"><button id="open">BUKA KAMERA</button><button id="start" disabled>START • 4 GAMBAR</button></div><canvas id="preview" width="1050" height="1500"></canvas><div class="buttons"><button id="save" disabled>SAVE PHOTO</button><button id="reset" class="alt">NEW SESSION</button></div><p class="hint">4 gambar (2 × 2) • 3.5 × 5 inci (89 × 127 mm) • RM3<br>Selepas SAVE, pilih saiz kertas 3.5 × 5 inci dalam aplikasi Epson.</p></main>
<script>
const el=id=>document.getElementById(id),video=el('camera'),canvas=el('preview'),ctx=canvas.getContext('2d'),frame=new Image();
// These four coordinates correspond to the transparent windows in kampung-frame.png.
const slots=[[76,305,429,420],[545,305,422,420],[76,745,429,425],[545,745,422,425]];
let stream=null,photos=[],busy=false,ready=false,frameReady=false,cancelCapture=false,sessionToken=0;
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function msg(s){el('status').textContent=s;el('overlayStatus').textContent=s}function showCamera(){const overlay=el('cameraOverlay');if(overlay.parentElement!==document.body)document.body.appendChild(overlay);overlay.classList.add('active');document.body.classList.add('capturing')}function hideCamera(){el('cameraOverlay').classList.remove('active');document.body.classList.remove('capturing')}function stopCamera(){cancelCapture=true;sessionToken++;busy=false;photos=[];ready=false;draw();el('save').disabled=true;hideCamera();if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null;el('start').disabled=true;el('overlayStart').disabled=true;el('count').textContent='';el('shotLabel').textContent='KAMERA';el('overlayStart').textContent='AMBIL GAMBAR 1 / 4';msg('Kamera ditutup. Tekan BUKA KAMERA untuk mula semula.')}
function cover(img,x,y,w,h){const iw=img.width,ih=img.height,r=Math.max(w/iw,h/ih),sw=w/r,sh=h/r;ctx.drawImage(img,(iw-sw)/2,(ih-sh)/2,sw,sh,x,y,w,h)}
function draw(){ctx.fillStyle='#fffaf4';ctx.fillRect(0,0,1050,1500);slots.forEach(([x,y,w,h],i)=>{if(photos[i])cover(photos[i],x,y,w,h);else{ctx.fillStyle='#d8d8db';ctx.fillRect(x,y,w,h)}});if(frameReady)ctx.drawImage(frame,0,0,1050,1500)}
frame.onload=()=>{frameReady=true;draw()};frame.onerror=()=>msg('Frame gagal dimuatkan. Semak kampung-frame.png dalam GitHub.');frame.src='kampung-frame.png?v=8';draw();
async function openCamera(){try{cancelCapture=false;if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:960}},audio:false});video.srcObject=stream;await video.play();showCamera();el('start').disabled=false;el('overlayStart').disabled=false;el('overlayStart').textContent='AMBIL GAMBAR 1 / 4';el('shotLabel').textContent='GAMBAR 1 / 4';msg('Kamera sedia. Tekan AMBIL GAMBAR 1 / 4.')}catch(e){msg('Benarkan akses kamera di Safari. '+e.message)}}
function snap(){const c=document.createElement('canvas');c.width=video.videoWidth;c.height=video.videoHeight;const g=c.getContext('2d');g.translate(c.width,0);g.scale(-1,1);g.drawImage(video,0,0);return c}
async function countdown(){for(let i=3;i>=1;i--){if(cancelCapture)return false;el('count').textContent=i;await wait(950)}if(cancelCapture)return false;el('count').textContent='📸';await wait(250);el('count').textContent='';return !cancelCapture}
async function start(){
  if(busy||!stream||!frameReady||ready)return;
  if(photos.length>=4)return;
  const token=sessionToken;
  busy=true;
  const number=photos.length+1;
  el('start').disabled=true;
  el('overlayStart').disabled=true;
  showCamera();
  el('shotLabel').textContent='GAMBAR '+number+' / 4';
  msg('Bersedia untuk gambar '+number+' daripada 4');
  try{
    const ok=await countdown();
    if(!ok||cancelCapture||token!==sessionToken||!stream)return;
    photos.push(snap());
    draw();
    if(photos.length===4){
      ready=true;
      el('save').disabled=false;
      hideCamera();
      msg('Siap! Semua 4 gambar diambil. Tekan SAVE PHOTO.');
    }else{
      const next=photos.length+1;
      el('shotLabel').textContent='SELESAI '+photos.length+' / 4';
      el('overlayStart').textContent='NEXT PHOTO • '+next+' / 4';
      msg('Gambar '+photos.length+' siap! Tukar pose, kemudian tekan NEXT PHOTO.');
    }
  }catch(e){msg('Ralat kamera: '+e.message)}
  finally{
    if(token===sessionToken){
      busy=false;
      el('start').disabled=!stream||ready;
      el('overlayStart').disabled=!stream||ready;
    }
  }
}
async function save(){if(!ready)return;canvas.toBlob(async blob=>{if(!blob){msg('Gagal menyimpan.');return}const filename='SKTT-Artnese-'+Date.now()+'.png';const file=new File([blob],filename,{type:'image/png'});try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});msg('Pilih Save Image atau Save to Files daripada menu Share.');return}}catch(e){if(e.name==='AbortError'){msg('Menu Share ditutup. Tekan SAVE untuk cuba semula.');return}}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);msg('Fail PNG disediakan. Jika gambar terbuka, tekan Share → Save Image.')},'image/png')}
function reset(){sessionToken++;cancelCapture=true;busy=false;hideCamera();photos=[];ready=false;draw();el('save').disabled=true;el('count').textContent='';el('overlayStart').textContent='AMBIL GAMBAR 1 / 4';el('start').disabled=!stream;el('overlayStart').disabled=!stream;msg('Sesi baharu. Tekan BUKA KAMERA, kemudian AMBIL GAMBAR.')}
el('open').onclick=openCamera;el('start').onclick=start;el('overlayStart').onclick=start;el('save').onclick=save;el('reset').onclick=reset;el('closeCamera').onclick=stopCamera;
</script></body></html>
